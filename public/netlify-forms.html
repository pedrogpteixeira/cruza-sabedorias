<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Definição estática de formulários</title></head><body>
<!-- A Netlify reconhece os campos deste formulário durante o build. Manter sincronizados. -->
<form name="cruza-contactos" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="cruza-contactos">
  <input name="name" type="text">
  <input name="email" type="email">
  <input name="phone" type="tel">
  <input name="profile" type="text">
  <input name="service" type="text">
  <textarea name="message"></textarea>
  <input name="consent" type="checkbox">
  <input name="bot-field" type="text">
</form>
</body></html>
