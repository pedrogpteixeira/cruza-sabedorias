[build]
  command = "npm run build && node scripts/finalize-seo.mjs"
  publish = "dist/cruza-sabedorias/browser"

[build.environment]
  NODE_VERSION = "22.22.3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
